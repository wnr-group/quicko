# Standalone Postgres for local dev (replaces Supabase's local stack).
# Start: npm run db:up   ·   Stop: npm run db:down   ·   Studio: any psql client
services:
  db:
    image: postgres:17-alpine
    container_name: quiko-postgres
    environment:
      POSTGRES_USER: quiko
      POSTGRES_PASSWORD: quiko
      POSTGRES_DB: quiko
    ports:
      - "5433:5432"
    volumes:
      - quiko-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiko -d quiko"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiko-pgdata:
